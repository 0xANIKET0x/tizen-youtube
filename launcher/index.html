<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT service and launcher</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        width: 100%;
        height: 100%;
        background-color: #0d0f14;
        color: #f1f1f1;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, monospace;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 5vh 6vw;
    }

    .header {
        display: flex;
        align-items: center;
        gap: 22px;
    }

    .logo-container {
        width: 60px;
        height: 60px;
        background: #161922;
        border: 2px solid #00b4d8;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 20px rgba(0, 180, 216, 0.35);
    }

    .title-group h1 {
        font-size: 2.3rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #ffffff;
    }

    .title-group p {
        font-size: 1.05rem;
        color: #00b4d8;
        margin-top: 4px;
        font-weight: 500;
    }

    .center-card {
        background: #141720;
        border: 1px solid #232736;
        border-radius: 18px;
        padding: 34px 40px;
        margin: auto 0;
        max-width: 920px;
        width: 100%;
        align-self: center;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
    }

    .status-row {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 24px;
    }

    .spinner {
        width: 38px;
        height: 38px;
        border: 4px solid rgba(0, 180, 216, 0.2);
        border-top-color: #00b4d8;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        flex-shrink: 0;
    }

    .spinner.hidden { display: none; }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .status-text {
        font-size: 1.55rem;
        font-weight: 600;
        color: #ffffff;
    }

    .status-text.error {
        color: #ff5555;
    }

    .status-text.ok {
        color: #55ff99;
    }

    .status-text.ready {
        color: #00e5ff;
        font-size: 1.7rem;
        text-shadow: 0 0 16px rgba(0, 229, 255, 0.4);
    }

    .status-text.warn {
        color: #ffff55;
    }

    .console-box {
        background: #090b10;
        border-radius: 10px;
        padding: 16px 20px;
        font-family: "Consolas", "Courier New", monospace;
        font-size: 0.94rem;
        line-height: 1.6;
        color: #88c0d0;
        max-height: 220px;
        overflow-y: auto;
        white-space: pre-wrap;
        word-break: break-all;
        border: 1px solid #1c2130;
    }

    .action-row {
        margin-top: 24px;
        display: flex;
        align-items: center;
        gap: 20px;
    }

    .btn {
        background: #00b4d8;
        color: #090b10;
        border: none;
        padding: 14px 34px;
        border-radius: 10px;
        font-size: 1.25rem;
        font-weight: 700;
        cursor: pointer;
        outline: none;
        box-shadow: 0 4px 18px rgba(0, 180, 216, 0.4);
        transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn:hover, .btn:focus {
        background: #00e5ff;
        transform: scale(1.04);
        outline: 3px solid #ffffff;
    }

    .btn.yt {
        background: #ff0000;
        color: #ffffff;
        box-shadow: 0 4px 18px rgba(255, 0, 0, 0.45);
    }

    .btn.yt:hover, .btn.yt:focus {
        background: #ff3333;
        outline: 3px solid #ffffff;
    }

    .countdown-text {
        color: #9aa4b8;
        font-size: 1.05rem;
    }

    .footer {
        color: #647087;
        font-size: 0.95rem;
        display: flex;
        justify-content: space-between;
    }
</style>
</head>
<body>
    <div class="header">
        <div class="logo-container">
            <svg viewBox="0 0 48 48" width="40" height="40">
                <circle cx="24" cy="24" r="21" fill="#141720" stroke="#00b4d8" stroke-width="2.5"/>
                <path d="M24 8 L26 4 L30 5 L30 9 L34 11 L37 8 L40 11 L37 14 L39 18 L43 18 L43 22 L43 26 L39 26 L37 30 L40 33 L37 36 L34 33 L30 35 L30 39 L26 40 L24 36 L22 40 L18 39 L18 35 L14 33 L11 36 L8 33 L11 30 L9 26 L5 26 L5 22 L5 18 L9 18 L11 14 L8 11 L11 8 L14 11 L18 9 L18 5 L22 4 Z" fill="#252a3a" stroke="#00b4d8" stroke-width="1.5"/>
                <rect x="13" y="15" width="22" height="18" rx="6" fill="#ff0000"/>
                <polygon points="21,19 28,24 21,29" fill="#ffffff"/>
                <polygon points="34,31 40,37 36,37 37,41 33,37 33,35" fill="#00e5ff"/>
            </svg>
        </div>
        <div class="title-group">
            <h1>YT service and launcher</h1>
            <p>Service &amp; App Launcher for Tizen 9 &amp; 10</p>
        </div>
    </div>

    <div class="center-card">
        <div class="status-row">
            <div id="spinner" class="spinner"></div>
            <div id="status" class="status-text">Checking background service status...</div>
        </div>
        <div id="console" class="console-box"></div>
        <div id="actions" class="action-row" style="display: none;">
            <button id="mainBtn" class="btn yt" tabindex="0">You can open YT now</button>
            <span id="countdown" class="countdown-text"></span>
        </div>
    </div>

    <div class="footer">
        <span id="platformInfo">Detecting platform...</span>
        <span>Press Return / Back to exit</span>
    </div>

<script>
(function() {
    'use strict';

    var statusEl = document.getElementById('status');
    var spinnerEl = document.getElementById('spinner');
    var consoleEl = document.getElementById('console');
    var actionsEl = document.getElementById('actions');
    var mainBtn = document.getElementById('mainBtn');
    var countdownEl = document.getElementById('countdown');
    var platformInfoEl = document.getElementById('platformInfo');

    var isRunning = false;
    var targetAppId = 'tUb3Xq7Lm9.Tube';
    var targetServiceId = 'tUb3Xq7Lm9.TubeService';
    var countdownTimer = null;

    var SESSION_KEY = 'yt_service_session_active';
    var SESSION_TIME_KEY = 'yt_service_session_time';
    var SESSION_MAX_HOURS = 14;

    function log(msg) {
        var time = new Date().toISOString().substring(11, 19);
        var line = '[' + time + '] ' + msg;
        console.log(line);
        if (consoleEl) {
            consoleEl.textContent += line + '\n';
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }
    }

    function setStatus(text, type) {
        if (!statusEl) return;
        statusEl.textContent = text;
        statusEl.className = 'status-text' + (type ? ' ' + type : '');
        if (type === 'error' || type === 'ok' || type === 'ready') {
            spinnerEl.classList.add('hidden');
        } else {
            spinnerEl.classList.remove('hidden');
        }
    }

    function showError(err) {
        if (countdownTimer) clearInterval(countdownTimer);
        var msg = (err && err.message) || err || 'Unknown error';
        setStatus('Error: ' + msg, 'error');
        log('ERROR: ' + msg);
        if (actionsEl && mainBtn) {
            mainBtn.textContent = 'Retry (Press Enter)';
            mainBtn.className = 'btn';
            actionsEl.style.display = 'flex';
            if (countdownEl) countdownEl.textContent = '';
            mainBtn.focus();
            mainBtn.onclick = function() {
                clearSession();
                run();
            };
        }
    }

    function getPlatform() {
        var ver = 'unknown';
        var model = 'unknown';
        try {
            if (typeof tizen !== 'undefined' && tizen.systeminfo) {
                ver = tizen.systeminfo.getCapability('http://tizen.org/feature/platform.version') || ver;
                model = tizen.systeminfo.getCapability('http://tizen.org/feature/platform.model_name') || model;
            }
        } catch (e) {}
        return { version: ver, model: model, major: parseInt(ver, 10) || 0 };
    }

    function resolveTargets() {
        if (typeof tizen !== 'undefined' && tizen.application && tizen.application.getAppInfo) {
            try {
                tizen.application.getAppInfo('tUb3Xq7Lm9.Tube');
                return { appId: 'tUb3Xq7Lm9.Tube', serviceId: 'tUb3Xq7Lm9.TubeService' };
            } catch (e) {}
            try {
                tizen.application.getAppInfo('tUb3Xq7L50.Tube');
                return { appId: 'tUb3Xq7L50.Tube', serviceId: 'tUb3Xq7L50.TubeService' };
            } catch (e) {}
        }
        return { appId: 'tUb3Xq7Lm9.Tube', serviceId: 'tUb3Xq7Lm9.TubeService' };
    }

    function markSessionActive() {
        try {
            localStorage.setItem(SESSION_KEY, 'true');
            localStorage.setItem(SESSION_TIME_KEY, String(Date.now()));
        } catch (e) {}
    }

    function clearSession() {
        try {
            localStorage.removeItem(SESSION_KEY);
            localStorage.removeItem(SESSION_TIME_KEY);
        } catch (e) {}
    }

    function isSessionActiveStored() {
        try {
            var active = localStorage.getItem(SESSION_KEY);
            var timestamp = parseInt(localStorage.getItem(SESSION_TIME_KEY), 10) || 0;
            if (active === 'true' && (Date.now() - timestamp) < SESSION_MAX_HOURS * 60 * 60 * 1000) {
                return true;
            }
        } catch (e) {}
        return false;
    }

    // Check if background service process is actively registered in running app contexts
    function checkLiveContext(serviceId) {
        return new Promise(function(resolve) {
            if (typeof tizen === 'undefined' || !tizen.application || !tizen.application.getAppsContext) {
                resolve(false);
                return;
            }
            try {
                tizen.application.getAppsContext(
                    function(contexts) {
                        var isFound = contexts.some(function(ctx) {
                            return ctx && ctx.appId === serviceId;
                        });
                        resolve(isFound);
                    },
                    function() { resolve(false); }
                );
            } catch (e) {
                resolve(false);
            }
        });
    }

    // Non-blocking fast socket ping (200ms)
    function quickPing(url) {
        return new Promise(function(resolve) {
            var xhr = new XMLHttpRequest();
            var done = false;
            var timer = setTimeout(function() {
                if (done) return;
                done = true;
                try { xhr.abort(); } catch (e) {}
                resolve(false);
            }, 200);

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && !done) {
                    done = true;
                    clearTimeout(timer);
                    resolve(xhr.status >= 200 && xhr.status < 400);
                }
            };
            xhr.onerror = function() {
                if (!done) { done = true; clearTimeout(timer); resolve(false); }
            };
            try {
                xhr.open('GET', url, true);
                xhr.send();
            } catch (e) {
                if (!done) { done = true; clearTimeout(timer); resolve(false); }
            }
        });
    }

    async function isServicePreviouslyLaunched(serviceId) {
        // 1. Check live process context
        var runningInContext = await checkLiveContext(serviceId);
        if (runningInContext) {
            log('Background service verified running in system process list.');
            return true;
        }

        // 2. Quick non-blocking socket ping
        var endpoints = [
            'http://127.0.0.1:8099/__tube/ping',
            'http://127.0.0.2:8099/__tube/ping'
        ];
        for (var i = 0; i < endpoints.length; i++) {
            if (await quickPing(endpoints[i])) {
                log('Background service actively responding on port 8099.');
                return true;
            }
        }

        // 3. Check persistent session memory
        if (isSessionActiveStored()) {
            log('Background service was previously launched in this session.');
            return true;
        }

        return false;
    }

    async function getWrtServiceClass() {
        if (typeof window.tbWrtService === 'function') {
            return window.tbWrtService;
        }

        // Method 1: native dynamic import
        try {
            var mod = await import('wrt:service');
            if (mod && typeof mod.Service === 'function') {
                window.tbWrtService = mod.Service;
                return mod.Service;
            }
        } catch (e) {
            log('Dynamic import("wrt:service") note: ' + (e && e.message ? e.message : e));
        }

        // Method 2: module script tag injection
        return new Promise(function(resolve) {
            var settled = false;
            var onReady = function() {
                if (settled) return;
                settled = true;
                window.removeEventListener('tb-wrt-service', onReady);
                resolve(window.tbWrtService || null);
            };
            window.addEventListener('tb-wrt-service', onReady);
            setTimeout(onReady, 2500);

            try {
                var s = document.createElement('script');
                s.type = 'module';
                s.textContent = "import { Service } from 'wrt:service'; window.tbWrtService = Service; window.dispatchEvent(new Event('tb-wrt-service'));";
                s.onerror = onReady;
                document.head.appendChild(s);
            } catch (err) {
                log('Module script injection note: ' + (err && err.message ? err.message : err));
                onReady();
            }
        });
    }

    async function startService(serviceId) {
        log('Starting background service: ' + serviceId);
        var ServiceClass = await getWrtServiceClass();
        if (ServiceClass) {
            log('Using wrt:service Service class (Tizen 9/10)');
            try {
                var instance = new ServiceClass(serviceId);
                var started = instance.start();
                if (started && typeof started.then === 'function') {
                    await started;
                }
                log('Background service start acknowledged');
                return true;
            } catch (e) {
                log('wrt:service start threw: ' + (e && e.message ? e.message : e));
            }
        }

        // Fallback: launchAppControl
        if (typeof tizen !== 'undefined' && tizen.application && tizen.application.launchAppControl) {
            try {
                log('Trying launchAppControl fallback...');
                await new Promise(function(resolve, reject) {
                    tizen.application.launchAppControl(
                        new tizen.ApplicationControl("http://tizen.org/appcontrol/operation/service"),
                        serviceId,
                        resolve,
                        reject
                    );
                });
                log('Background service start acknowledged (via launchAppControl)');
                return true;
            } catch (e) {
                log('launchAppControl note: ' + (e && e.message ? e.message : e));
            }
        }

        // Fallback: direct application.launch
        if (typeof tizen !== 'undefined' && tizen.application && tizen.application.launch) {
            try {
                log('Trying application.launch fallback...');
                await new Promise(function(resolve, reject) {
                    tizen.application.launch(serviceId, resolve, reject);
                });
                log('Background service start acknowledged (via application.launch)');
                return true;
            } catch (e) {
                log('application.launch note: ' + (e && e.message ? e.message : e));
            }
        }

        return false;
    }

    function launchCobalt(appId) {
        log('Launching ' + appId + '...');
        if (typeof tizen === 'undefined' || !tizen.application || !tizen.application.launch) {
            showError(new Error('tizen.application.launch is not available on this platform.'));
            return;
        }

        tizen.application.launch(
            appId,
            function() {
                log('YouTube launched successfully!');
                setTimeout(function() {
                    try {
                        tizen.application.getCurrentApplication().exit();
                    } catch (e) {}
                }, 1200);
            },
            function(err) {
                var message = (err && err.message) || err || 'Launch failed';
                showError(new Error('Failed to launch ' + appId + ': ' + message));
            }
        );
    }

    function promptStartApp(appId) {
        setStatus('You can open YT now', 'ready');
        log('You can open YT now');

        if (actionsEl && mainBtn) {
            mainBtn.textContent = 'You can open YT now (Press Enter)';
            mainBtn.className = 'btn yt';
            actionsEl.style.display = 'flex';
            mainBtn.focus();

            var secondsLeft = 2;
            if (countdownEl) countdownEl.textContent = 'Opening YouTube in ' + secondsLeft + 's...';

            countdownTimer = setInterval(function() {
                secondsLeft--;
                if (secondsLeft > 0) {
                    if (countdownEl) countdownEl.textContent = 'Opening YouTube in ' + secondsLeft + 's...';
                } else {
                    clearInterval(countdownTimer);
                    if (countdownEl) countdownEl.textContent = 'Opening YouTube...';
                    launchCobalt(appId);
                }
            }, 1000);

            mainBtn.onclick = function() {
                if (countdownTimer) clearInterval(countdownTimer);
                launchCobalt(appId);
            };
        } else {
            launchCobalt(appId);
        }
    }

    async function run() {
        if (isRunning) return;
        isRunning = true;
        if (countdownTimer) clearInterval(countdownTimer);
        if (actionsEl) actionsEl.style.display = 'none';

        var platform = getPlatform();
        platformInfoEl.textContent = 'Tizen ' + platform.version + ' (' + platform.model + ')';
        log('Platform: Tizen ' + platform.version + ', model: ' + platform.model);

        var targets = resolveTargets();
        targetAppId = targets.appId;
        targetServiceId = targets.serviceId;
        log('Target App: ' + targetAppId + ' | Target Service: ' + targetServiceId);

        // Check if service previously launched successfully or is actively running in this session
        setStatus('Checking service session state...');
        var alreadyActive = await isServicePreviouslyLaunched(targetServiceId);
        if (alreadyActive) {
            log('Service active from current session. Launching YouTube...');
            promptStartApp(targetAppId);
            return;
        }

        // If not already active, trigger background service start
        setStatus('Starting YT background service...');
        var acknowledged = await startService(targetServiceId);

        if (acknowledged) {
            markSessionActive();
            promptStartApp(targetAppId);
        } else {
            showError(new Error('Background service launch could not be acknowledged.'));
            isRunning = false;
        }
    }

    // Register Tizen TV Return key
    if (typeof tizen !== 'undefined' && tizen.tvinputdevice) {
        try {
            tizen.tvinputdevice.registerKey('Return');
        } catch (e) {}
    }

    // Key handlers
    document.addEventListener('keydown', function(e) {
        if (e.keyCode === 10009 || e.key === 'GoBack') {
            try {
                tizen.application.getCurrentApplication().exit();
            } catch (err) {}
        } else if (e.keyCode === 13) {
            if (actionsEl && actionsEl.style.display !== 'none' && mainBtn) {
                mainBtn.click();
            }
        }
    });

    window.addEventListener('load', function() {
        setTimeout(run, 200);
    });
})();
</script>
</body>
</html>
